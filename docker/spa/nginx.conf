# Versão ANTIGA (:8082): o app (Vue 1, compilado de legacy/) em /app e, no resto, o SITE do legado (Laravel Blade:
# /login, /register, /my-financial, /admin/…) por proxy. No deploy original os dois eram a MESMA origem: o menu do app
# abre /my-financial?token=… com caminho relativo (Menu.vue:121) — sem o proxy, 404 aqui.

# Log SEM a query string: o app abre /my-financial?token=<JWT> (mesmo cuidado da :8083 — revisão do site, S7)
map $request_uri $caminho_sem_query {
    ~^(?<caminho>[^?]*) $caminho;
}
log_format sem_query '$remote_addr - $remote_user [$time_local] "$request_method $caminho_sem_query $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /var/log/nginx/access.log sem_query;
    error_log /var/log/nginx/error.log crit;

    # O SPA monta a URL de login como <host>/app#!/login (services/appConfig.js)
    location = / { return 302 /app; }
    location = /app { try_files /app/index.html =404; }
    location /app/ { try_files $uri /app/index.html; }
    # Arquivos do app (build, css, fonts, img) daqui; o resto é o site Laravel do legado
    location / { try_files $uri @legado; }
    location @legado {
        proxy_pass http://legacy-app:80;
        # Host da própria :8082: os redirecionamentos do Laravel (login → /home, admin…) ficam nesta origem
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

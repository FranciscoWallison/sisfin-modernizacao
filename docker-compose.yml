# ORÁCULO (legacy-*) e sistema novo (api-*) lado a lado. Paridade: tools/paridade.mjs --base :8081 | :3000
services:
  legacy-db:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: sisfin
      MYSQL_USER: sisfin
      MYSQL_PASSWORD: sisfin
      MYSQL_ROOT_PASSWORD: root
    ports: ["33061:3306"]
    volumes: [legacy-db:/var/lib/mysql]

  legacy-app:
    build:
      context: .
      dockerfile: docker/legacy/Dockerfile
    depends_on: [legacy-db]
    ports: ["8081:80"]
    environment:
      LEGACY_SEED: "1"
      LEGACY_SEED_VALUE: "42"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8081
      # Chaves SÓ de desenvolvimento local — o oráculo não é exposto
      APP_KEY: base64:c2lzZmluLWxlZ2Fkby1vcmFjdWxvLWxvY2FsLTAwMDA=
      JWT_SECRET: sisfin-legado-oraculo-somente-local
      DB_CONNECTION: mysql
      DB_HOST: legacy-db
      DB_PORT: "3306"
      DB_DATABASE: sisfin
      DB_USERNAME: sisfin
      DB_PASSWORD: sisfin
      BROADCAST_DRIVER: log
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_DRIVER: sync
      MAIL_DRIVER: log
      IUGU_API_KEY: ""
      PUSHER_APP_ID: ""
      PUSHER_KEY: ""
      PUSHER_SECRET: ""
      URL_ADMIN_LOGIN: /admin/login
      URL_ADMIN_LOGOUT: /admin/logout
      URL_SITE_LOGIN: /login
      URL_SITE_LOGOUT: /logout
      BANK_LOGO_DEFAULT: default.jpg
      API_URL: http://localhost:8081/api

  api-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sisfin
      POSTGRES_USER: sisfin
      POSTGRES_PASSWORD: sisfin
    ports: ["54321:5432"]
    volumes: [api-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisfin -d sisfin"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    depends_on:
      api-db:
        condition: service_healthy
    ports: ["3300:3000"]
    environment:
      # development: é o ambiente LOCAL; com production a API recusaria o segredo de desenvolvimento abaixo
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://sisfin:sisfin@api-db:5432/sisfin
      # Só desenvolvimento local. Diferente do segredo do legado (ADR-005): tokens não são intercambiáveis
      JWT_SECRET: sisfin-api-segredo-local-de-desenvolvimento-nao-usar-em-producao
      CORS_ORIGINS: http://localhost:8081,http://localhost:8083
      # Base dos links de logo dos bancos (REQ-CBA-07): os arquivos moram no storage do legado durante o strangler
      ASSETS_URL: http://localhost:8081

  # A MESMA tela do legado (SPA Vue 1 compilado de legacy/) servida duas vezes — só muda a API por trás.
  # É o Strangler Fig visível: o front não sabe qual backend atende.
  spa-antigo:
    build:
      context: .
      dockerfile: docker/spa/Dockerfile
      target: servidor
      args:
        API_URL: http://localhost:8081/api
        ROTULO: "Versão antiga — API Laravel 5.3 (:8081)"
        COR: "#c62828"
    depends_on: [legacy-app]
    ports: ["8082:80"]

  spa-novo:
    build:
      context: .
      dockerfile: docker/spa/Dockerfile
      target: servidor
      args:
        API_URL: http://localhost:3300/api
        ROTULO: "Versão nova — API NestJS (:3300)"
        COR: "#2e7d32"
    depends_on: [api]
    ports: ["8083:80"]

volumes:
  legacy-db:
  api-db:
